<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalte Station</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="spiel">
    <header id="ort"><span id="ort-name">Kabine</span> · <span id="temp"></span></header>

    <section id="ertrag" hidden>
      <span class="label">Ertrag</span>
      <span id="ertrag-wert">0</span>
      <span class="label">pro Tick</span>
    </section>

    <div id="spalten">
      <section id="aktionen"></section>
      <div id="mitte">
        <section id="vorraete" hidden>
          <h2>Vorräte</h2>
          <div id="vorrat-liste"></div>
        </section>
        <section id="leute" hidden>
          <h2>Leute <span id="leute-zahl"></span></h2>
          <div id="job-liste"></div>
          <div class="vorrat"><span>ohne Aufgabe</span><span id="leute-frei"></span></div>
        </section>
        <section id="schicht" hidden>
          <h2><label for="quote">Schicht</label></h2>
          <input type="range" id="quote" min="0.5" max="1.5" step="0.1" value="1">
          <div class="vorrat"><span id="quote-text"></span><span id="quote-wert"></span></div>
        </section>
      </div>
      <ul id="log"></ul>
    </div>
  </main>

  <footer>
    <button id="spielstand-auf" class="link">Spielstand</button>
    <div id="spielstand" hidden>
      <textarea id="spielstand-text" rows="4" spellcheck="false" placeholder="Spielstand hier einfügen"></textarea>
      <div class="zeile">
        <button id="export">Exportieren</button>
        <button id="import">Importieren</button>
        <button id="neustart">Neustart</button>
        <span id="spielstand-meldung"></span>
      </div>
    </div>
  </footer>

  <aside id="debug" hidden>
    <pre id="debug-werte"></pre>
    <button id="dbg-energie">+20 Energie</button>
    <button id="dbg-schrott">+50 Schrott</button>
    <button id="dbg-person">+1 Person</button>
  </aside>

  <noscript>Die Station braucht JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
